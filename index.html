 var tb=p.querySelector('.fg-tabs');TABS.forEach(function(t){var b=document.createElement('button');b.dataset.k=t[0];b.textContent=t[1];b.onclick=function(){S.tab=t[0];render()};tb.appendChild(b)});
 p.querySelector('.fg-del').onclick=function(){if(S.sel&&S.dir&&S.dir.remove){S.dir.remove(S.sel);S.sel=null;render()}};
 p.querySelector('.fg-chk input').onchange=function(){S.showDirs=this.checked;render()};
 ls.after(p);return p}
function sortIt(a){return a.sort(function(x,y){return x.name.localeCompare(y.name,undefined,{numeric:true})})}
async function render(){var g=pane();if(!g)return;var l=g.querySelector('.fg-list');
 g.querySelectorAll('.fg-tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.k===S.tab)});
 if(!S.dir){l.innerHTML='';g.querySelector('.fg-n').textContent='';return}
 var res=await S.dir.list();var files=sortIt(res.files.filter(function(f){return f.kind===S.tab})),dirs=S.showDirs?sortIt(res.dirs):[];
 l.innerHTML='';
 if(S.path){var pe=document.createElement('div');pe.className='fg-path';pe.textContent=S.path;pe.title=S.path;l.appendChild(pe)}
 if(S.hint){var hb=document.createElement('div');hb.className='fg-item fg-hint';hb.innerHTML='<span>إظهار باقي ملفات هذا المجلد</span>';hb.onclick=function(){window.__grant()};l.appendChild(hb)}
 if(S.stack.length){var bk=document.createElement('div');bk.className='fg-item fg-dir';bk.innerHTML='<b class="k-dir">..</b><span>رجوع</span>';bk.onclick=function(){S.dir=S.stack.pop();render()};l.appendChild(bk)}
 dirs.forEach(function(d){var it=document.createElement('div');it.className='fg-item fg-dir';it.innerHTML='<b class="k-dir">مجلد</b><span></span>';it.lastChild.textContent=d.name;it.onclick=function(){S.stack.push(S.dir);S.dir=d.node;render()};l.appendChild(it)});
 files.forEach(function(f){var it=document.createElement('div');it.className='fg-item'+(S.sel===f?' on':'');var lb=TABS.filter(function(t){return t[0]===f.kind})[0][1];
  it.innerHTML='<b class="k-'+f.kind+'">'+lb+'</b><span></span>';it.lastChild.textContent=f.name;it.title=f.name;
  it.onclick=function(){S.sel=f;l.querySelectorAll('.fg-item').forEach(function(x){x.classList.remove('on')});it.classList.add('on');Promise.resolve(f.get()).then(function(file){if(window.processFile)processFile(file)})};l.appendChild(it)});
 g.querySelector('.fg-n').textContent=files.length||''}
function nodeFromHandle(h){return{name:h.name,list:async function(){var d=[],f=[];for await(var e of h.values()){if(e.kind==='directory')d.push({name:e.name,node:nodeFromHandle(e)});else{var k=KIND(e.name,'');if(k)(function(x){f.push({name:x.name,kind:k,get:function(){return x.getFile().then(function(fl){fl.mcPath=h.name+'/'+x.name;return fl})}})})(e)}}return{dirs:d,files:f}}}}
function nodeFromTree(name,t){return{name:name,t:t,remove:function(f){t.f=t.f.filter(function(x){return x!==f})},list:async function(){var d=[];Object.keys(t.d).forEach(function(k){d.push({name:k,node:nodeFromTree(k,t.d[k])})});return{dirs:d,files:t.f}}}}
function openRoot(n){S.path=null;S.dir=n;S.stack=[];S.sel=null;S.hint=null;render()}
function fromInput(inp){var fl=Array.prototype.slice.call(inp.files);if(!fl.length)return null;var root={d:{},f:[]},rn='ملفات',first=null;
 fl.forEach(function(f){var k=KIND(f.name,f.type);if(!k)return;var parts=(f.webkitRelativePath||'').split('/').filter(Boolean);var t=root;if(parts.length>1){rn=parts[0];for(var i=1;i<parts.length-1;i++){t=t.d[parts[i]]||(t.d[parts[i]]={d:{},f:[]})}}
  var it={name:f.name,kind:k,get:function(){return f}};t.f.push(it);if(!first)first=it});
 return{node:nodeFromTree(rn,root),first:first}}
inpF.onchange=function(){var r=fromInput(inpF);inpF.value='';if(!r)return;if(S.dir&&S.dir.t&&!S.stack.length){var ex=S.dir.t.f;r.node.t.f.forEach(function(it){if(!ex.some(function(x){return x.name===it.name}))ex.push(it)});r.node=S.dir}openRoot(r.node);if(r.first){S.tab=r.first.kind;S.sel=r.first;render();Promise.resolve(r.first.get()).then(function(f){if(window.processFile)processFile(f)})}};
inpD.onchange=function(){var r=fromInput(inpD);inpD.value='';if(!r)return;openRoot(r.node)};
function idb(){return new Promise(function(ok,no){var r=indexedDB.open('mc-dirs',1);r.onupgradeneeded=function(){r.result.createObjectStore('roots',{autoIncrement:true})};r.onsuccess=function(){ok(r.result)};r.onerror=no})}
async function rootsAll(){try{var d=await idb();return await new Promise(function(ok){var q=d.transaction('roots').objectStore('roots').getAll();q.onsuccess=function(){ok(q.result||[])};q.onerror=function(){ok([])}})}catch(e){return[]}}
async function rootsAdd(h){try{var d=await idb();d.transaction('roots','readwrite').objectStore('roots').put(h)}catch(e){}}
async function listFor(fh,roots){for(var i=0;i<roots.length;i++){var r=roots[i];try{var p=await r.resolve(fh);if(!p)continue;var q=await r.queryPermission({mode:'read'});if(q!=='granted'){q=await r.requestPermission({mode:'read'});if(q!=='granted')continue}
  var d=r;for(var k=0;k<p.length-1;k++)d=await d.getDirectoryHandle(p[k]);return d}catch(e){}}return null}
function showDir(dh,fh,kind){S.hint=null;S.tab=kind||S.tab;openRoot(nodeFromHandle(dh));S.pendName=fh.name}
window.openFolder=async function(){
 if(!window.showOpenFilePicker||!window.showDirectoryPicker){inpD.value='';inpD.click();return}
 if(!(await rootsAll()).length){window.openFolderTree();return}
 try{
  var hs=await showOpenFilePicker({id:'lessons',multiple:false,types:[{description:'ملفات الدرس',accept:{'application/pdf':['.pdf'],'image/*':['.png','.jpg','.jpeg','.gif','.webp','.bmp','.svg','.avif'],'application/json':['.json','.sbm'],'video/*':['.mp4','.webm','.mov','.m4v','.ogv']}}]});
  var fh=hs[0],file=await fh.getFile(),kind=KIND(file.name,file.type)||S.tab;
  if(window.processFile)processFile(file);
  var dh=await listFor(fh,await rootsAll());
  if(dh){showDir(dh,fh,kind);S.sel=null;return}
  var one={d:{},f:[{name:file.name,kind:kind,get:function(){return fh.getFile()}}]};S.tab=kind;openRoot(nodeFromTree('ملف',one));S.hint=fh;render();
 }catch(e){if(!e||e.name!=='AbortError')console.warn(e)}};
async function grant(){var fh=S.hint;if(!fh)return;try{var dh=await showDirectoryPicker({id:'lessons',startIn:fh,mode:'read'});await rootsAdd(dh);showDir(dh,fh,S.tab)}catch(e){}}
window.openFolderTree=async function(){
 if(window.showDirectoryPicker){try{var dh=await showDirectoryPicker({id:'lessons',mode:'read'});await rootsAdd(dh);openRoot(nodeFromHandle(dh));return}catch(err){if(err&&err.name==='AbortError')return}}
 inpD.value='';inpD.click()};
window.__grant=grant;
/* ملفات مجلد الصفحة نفسه: تُعرض تلقائيًا عند الفتح (files.json أو قائمة المجلد من الخادم) */
window.__openUrls=function(path,items){var cnt={};items.forEach(function(i){cnt[i.kind]=(cnt[i.kind]||0)+1});var best=TABS.map(function(t){return t[0]}).sort(function(a,b){return(cnt[b]||0)-(cnt[a]||0)})[0];
 var tree={d:{},f:items.map(function(it){return{name:it.name,kind:it.kind,get:function(){return fetch(it.url).then(function(r){return r.blob()}).then(function(b){var fl=new File([b],it.name,{type:b.type||''});fl.mcPath=decodeURI(it.url.replace(location.origin,''));return fl})}}})};
 openRoot(nodeFromTree('مجلد الصفحة',tree));S.tab=best;S.path=path;render()};
function autoFolder(){var base=location.href.replace(/[#?].*$/,'').replace(/[^\/]*$/,'');if(!/^https?:/.test(base))return;
 var skip=/^(files|package|manifest|firebase)[^\/]*\.json$/i;
 fetch(base+'files.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(j){return(Array.isArray(j)?j:(j.files||[])).map(function(n){return typeof n==='string'?n:(n.path||n.name)})})
 .catch(function(){return fetch(base,{cache:'no-cache'}).then(function(r){return r.ok?r.text():''}).then(function(t){var o=[],re=/href="([^"?#]+)"/gi,m;while((m=re.exec(t))){var h=m[1];if(/\/$/.test(h)||/^(https?:|\/|\.\.|mailto:)/.test(h))continue;try{h=decodeURIComponent(h)}catch(e){}o.push(h)}return o}).catch(function(){return[]})})
 .then(function(names){var items=names.filter(function(n){return n&&!skip.test(n.split('/').pop())}).map(function(n){var nm=n.split('/').pop();return{name:nm,kind:KIND(nm,''),url:base+n.split('/').map(encodeURIComponent).join('/')}}).filter(function(x){return x.kind});
  if(items.length&&!S.dir)window.__openUrls(decodeURI(base.replace(location.origin,'')||'/'),items)}).catch(function(){})}
setTimeout(autoFolder,700);
setTimeout(pane,300);
})()</script>
